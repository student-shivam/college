[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# API proxy (recommended): frontend calls `/api/*`, Netlify rewrites to Render backend.
# If you rename the Render backend service, update the hostname below accordingly.
[[redirects]]
  from = "/api/*"
  to = "https://predictive-maintenance-backend.onrender.com/api/:splat"
  status = 200
  force = true

# SPA routing: refresh on /dashboard etc should still load index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
