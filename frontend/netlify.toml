[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API through Netlify to avoid CORS and keep frontend using same-origin `/api`.
# Replace the `to` URL with your deployed backend base URL.
[[redirects]]
  from = "/api/*"
  to = "https://college-1-xt2h.onrender.com/api/:splat"
  status = 200
  force = true

# SPA routing (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
